
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirza Counter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .counter {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .label {
      margin-bottom: 24px;
      font-size: clamp(12px, 3vw, 16px);
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    #revenue {
      font-size: clamp(42px, 11vw, 76px);
      font-weight: 700;
      line-height: 1.05;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .orders-block {
      margin: 24px 0 32px;
    }

    .orders-label {
      margin-bottom: 8px;
      font-size: 10px;
      letter-spacing: 3px;
    }

    #count {
      font-size: 24px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .dates {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      text-align: left;
    }

    .date-field {
      flex: 1;
      min-width: 0;
    }

    .date-field label {
      display: block;
      margin-bottom: 8px;
      font-size: 10px;
      letter-spacing: 2px;
    }

    input[type="date"] {
      width: 100%;
      min-width: 0;
      padding: 12px 6px;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font-family: inherit;
      font-size: 12px;
    }

    button {
      width: 100%;
      padding: 15px 10px;
      border: 1px solid #000;
      border-radius: 0;
      background: #000;
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 3px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #period {
      margin-top: 14px;
      color: #777;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .disclaimer {
      margin-top: 30px;
      color: #777;
      font-size: 8px;
      line-height: 1.6;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #error {
      margin-top: 12px;
      color: #b00020;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 400px) {
      .dates {
        gap: 8px;
      }

      input[type="date"] {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="counter">

    <div class="label">VENTES NETTES HORS COMMISSION</div>

    <div id="revenue">—</div>

    <div class="orders-block">
      <div class="orders-label">TOTAL COMMANDES</div>
      <div id="count">—</div>
    </div>

    <div class="dates">
      <div class="date-field">
        <label for="start">DU</label>
        <input type="date" id="start" required>
      </div>

      <div class="date-field">
        <label for="end">AU</label>
        <input type="date" id="end" required>
      </div>
    </div>

    <button id="submit" type="button">ACTUALISER</button>

    <div id="period"></div>

    <div class="disclaimer">
      VENTES APRÈS DÉDUCTION DES TAXES ET TARIFS D'EXPÉDITION
    </div>

    <div id="error" role="status" aria-live="polite"></div>

  </main>

  <script>
    const startInput = document.getElementById("start");
    const endInput = document.getElementById("end");
    const revenueElement = document.getElementById("revenue");
    const countElement = document.getElementById("count");
    const errorElement = document.getElementById("error");
    const periodElement = document.getElementById("period");
    const submitButton = document.getElementById("submit");

    function parisToday() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Paris",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const values = {};

      parts.forEach(part => {
        values[part.type] = part.value;
      });

      return `${values.year}-${values.month}-${values.day}`;
    }

    function formatMoney(amount, currency) {
      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: currency || "EUR",
        maximumFractionDigits: 2
      }).format(amount);
    }

    const today = parisToday();

    startInput.value = today.slice(0, 7) + "-01";
    endInput.value = today;

    async function loadOrders() {
      const start = startInput.value;
      const end = endInput.value;

      errorElement.textContent = "";
      periodElement.textContent = "";

      if (!start || !end) {
        errorElement.textContent = "Sélectionne les deux dates.";
        return;
      }

      if (start > end) {
        errorElement.textContent =
          "La date de début doit précéder la date de fin.";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "CHARGEMENT...";
      revenueElement.textContent = "…";
      countElement.textContent = "…";

      try {
        const params = new URLSearchParams({ start, end });

        const response = await fetch(
          `/api/orders?${params.toString()}`,
          { cache: "no-store" }
        );

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || "Impossible de charger les ventes.");
        }

        const revenue = Number(data.netSales);
        const count = Number(data.count);

        if (!Number.isFinite(revenue) || !Number.isFinite(count)) {
          throw new Error("Réponse Shopify invalide.");
        }

        revenueElement.textContent =
          formatMoney(revenue, data.currency);

        countElement.textContent =
          count.toLocaleString("fr-FR");

        periodElement.textContent = `${start} — ${end}`;

      } catch (error) {
        console.error("COUNTER ERROR:", error);
        revenueElement.textContent = "—";
        countElement.textContent = "—";
        errorElement.textContent = error.message;

      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "ACTUALISER";
      }
    }

    submitButton.addEventListener("click", loadOrders);

    loadOrders();
  </script>
</body>
</html>
