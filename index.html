<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirza Counter</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .counter {
      text-align: center;
    }

    .label {
      font-size: 18px;
      letter-spacing: 4px;
      margin-bottom: 15px;
    }

    #count {
      font-size: 80px;
      font-weight: bold;
    }

    #error {
      margin-top: 20px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="counter">
    <div class="label">TOTAL ORDERS</div>
    <div id="count">...</div>
    <div id="error"></div>
  </div>

  <script>
    async function loadOrders() {
      try {
        const response = await fetch("/api/orders");
        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || "Unable to load orders");
        }

        document.getElementById("count").textContent =
          Number(data.count).toLocaleString("en-US");

      } catch (error) {
        document.getElementById("count").textContent = "—";
        document.getElementById("error").textContent = error.message;
      }
    }

    loadOrders();

    // Actualise le compteur toutes les 5 minutes
    setInterval(loadOrders, 5 * 60 * 1000);
  </script>

</body>
</html>
