<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mirza Counter</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;
    }

    body {
      display: flex;

      align-items: center;
      justify-content: center;

      background: #fff;
      color: #000;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .counter {
      text-align: center;
    }

    .label {
      margin-bottom: 15px;

      font-size: 18px;
      font-weight: 500;

      letter-spacing: 4px;
    }

    #count {
      font-size: 80px;

      line-height: 1;

      font-weight: 700;
    }

    .items {
      margin-top: 18px;

      font-size: 15px;
      font-weight: 400;

      letter-spacing: 1px;
    }

    #itemsCount {
      font-weight: 600;
    }

    #error {
      margin-top: 20px;

      font-size: 12px;

      color: #777;
    }

  </style>

</head>

<body>

  <div class="counter">

    <div class="label">
      TOTAL ORDERS TODAY
    </div>

    <div id="count">
      ...
    </div>

    <div class="items">
      ARTICLES SOLD:
      <span id="itemsCount">...</span>
    </div>

    <div id="error"></div>

  </div>

  <script>

    async function loadOrders() {

      const countElement =
        document.getElementById("count");

      const itemsElement =
        document.getElementById("itemsCount");

      const errorElement =
        document.getElementById("error");

      try {

        errorElement.textContent = "";

        const response =
          await fetch(
            "/api/orders",
            {
              cache: "no-store"
            }
          );

        const data =
          await response.json();

        if (
          !response.ok ||
          data.error
        ) {
          throw new Error(
            data.error ||
            "Unable to load orders"
          );
        }

        const orders =
          Number(data.orders);

        const items =
          Number(data.items);

        if (
          !Number.isFinite(orders) ||
          !Number.isFinite(items)
        ) {
          throw new Error(
            "Invalid order data"
          );
        }

        countElement.textContent =
          orders.toLocaleString("en-US");

        itemsElement.textContent =
          items.toLocaleString("en-US");

      } catch (error) {

        console.error(
          "COUNTER ERROR:",
          error
        );

        countElement.textContent = "—";

        itemsElement.textContent = "—";

        errorElement.textContent =
          error.message;
      }
    }

    loadOrders();

    // Actualisation toutes les 5 minutes
    setInterval(
      loadOrders,
      5 * 60 * 1000
    );

  </script>

</body>

</html>
