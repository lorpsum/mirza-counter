<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mirza Counter</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
      color: #fff;

      font-family: Arial, Helvetica, sans-serif;
    }

    .counter {
      text-align: center;
    }

    .label {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 4px;
      margin-bottom: 15px;
    }

    #count {
      font-size: 80px;
      line-height: 1;
      font-weight: 700;
    }

    #error {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="counter">

    <div class="label">
      TOTAL ORDERS
    </div>

    <div id="count">
      ...
    </div>

    <div id="error"></div>

  </div>

  <script>
    async function loadOrders() {
      const countElement = document.getElementById("count");
      const errorElement = document.getElementById("error");

      try {
        errorElement.textContent = "";

        const response = await fetch("/api/orders", {
          cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(
            data.error || "Unable to load orders"
          );
        }

        if (
          data.count === undefined ||
          data.count === null ||
          isNaN(Number(data.count))
        ) {
          throw new Error("Invalid order count received");
        }

        countElement.textContent =
          Number(data.count).toLocaleString("en-US");

      } catch (error) {
        countElement.textContent = "—";
        errorElement.textContent = error.message;
        console.error(error);
      }
    }

    loadOrders();

    // Actualisation toutes les 5 minutes
    setInterval(loadOrders, 5 * 60 * 1000);
  </script>

</body>
</html>
